name: Website checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Validate Cloudflare package without deploying
        run: npx wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'

